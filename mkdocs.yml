site_name: Lattice Propagator
site_url: https://dougransom.github.io/lattice-propagator/
site_description: Monotonic constraint networks and sensor fusion over partial-information lattices
site_author: Doug Ransom
repo_name: lattice-propagator
repo_url: https://github.com/dougransom/lattice-propagator

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Overview: index.md
  - Getting Started: getting_started.md
  - Requirements & Specification: requirements.md
  - Core Concepts:
      - The Information Semilattice: concepts/lattices.md
      - Reactive Cells & Networks: concepts/networks.md
      - Truth Maintenance & Backtracking: concepts/tms.md
      - Dynamic Topology & π-Calculus: concepts/dynamic_topology.md
  - Applications in Building & Home Automation:
      - Overview: building_automation/index.md
      - Event Buses, Node-RED, π-Calculus & Propagators: building_automation/paradigms_and_pi_calculus.md
  - Examples & Tutorials:
      - Bidirectional Arithmetic: examples/arithmetic.md
      - Sensor Fusion & Kalman Filters: examples/sensor_fusion.md
      - Evidential Reasoning & Presence: examples/evidence.md
      - Interval Envelopes & Bounds: examples/intervals.md
      - Sudoku & Search Choice Engine: examples/sudoku.md
      - Cryptarithmetic (SEND+MORE=MONEY): examples/cryptarithmetic.md
      - Circuit Fault Diagnosis & TMS: examples/circuit_diagnosis.md
      - N-Queens Constraint Search: examples/n_queens.md
      - Bidirectional Resistor Networks: examples/resistor_network.md
      - Kinematic Reachability Envelopes: examples/kinematics.md
      - Time-of-Day Circular Intervals: examples/clock_intervals.md
      - Signal Trajectories & Curve Generation: examples/trajectories.md
      - Dynamic EV Power Routing & π-Mobility: examples/dynamic_power_routing.md
      - CDCL SAT Solver via Two-Watched-Literals: examples/sat_solver.md
      - Wheatstone Bridge & Non-Linear Circuits: examples/wheatstone_bridge.md
      - Type Inference & Term Unification: examples/type_inference.md
      - Vehicle Localization & Degenerate Estimation: examples/degenerate_estimation.md
  - API Reference:
      - lattice: api/lattice.md
      - primitives: api/primitives.md
      - boolean: api/boolean.md
      - nonlinear: api/nonlinear.md
      - terms: api/terms.md
      - degenerate: api/degenerate.md
      - tms: api/tms.md
      - graph: api/graph.md
  - Development & Contributing:
      - Developer Guide: development.md
      - Contributing: contributing.md
