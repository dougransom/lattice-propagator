[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lattice-propagator"
version = "0.0.1dev1"
description = "Monotonic constraint networks and sensor fusion over partial-information lattices"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Doug Ransom", email = "doug@ransom.vip" }
]
license = { text = "MIT" }
dependencies = []

keywords = [
    "propagators",
    "lattice",
    "partial-information",
    "constraints",
    "sensor-fusion",
    "home-assistant",
    "sussman",
    "radul",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
lattice-dev = "lattice_propagator.dev_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-markdown-docs>=0.9.0",
    "ruff>=0.8.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "pymdown-extensions>=10.7",
]
build = [
    "flit>=3.9.0",
    "build>=1.2.0",
]
all = [
    "lattice-propagator[dev,docs,build]",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
python_files = ["test_*.py"]
addopts = "--markdown-docs"

