<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" style="background:#1e1e2e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Driveway Area -->
  <rect x="50" y="270" width="660" height="230" fill="#242535" stroke="#585b70" stroke-width="2" stroke-dasharray="6 4" rx="4" />
  <text x="380" y="400" fill="#a6adc8" font-size="16" font-weight="bold" text-anchor="middle">DRIVEWAY (~30 ft × 20 ft)</text>

  <!-- Garage Outer Boundary -->
  <rect x="50" y="35" width="660" height="235" fill="#181825" stroke="#cdd6f4" stroke-width="3" rx="4" filter="url(#shadow)"/>
  <text x="380" y="24" fill="#cdd6f4" font-size="16" font-weight="bold" text-anchor="middle">GARAGE (~30 ft × 20 ft)</text>

  <!-- Bay Dividers -->
  <line x1="270" y1="35" x2="270" y2="270" stroke="#45475a" stroke-width="2" stroke-dasharray="5 5" />
  <line x1="490" y1="35" x2="490" y2="270" stroke="#45475a" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Garage Doors Line -->
  <line x1="50" y1="270" x2="710" y2="270" stroke="#f38ba8" stroke-width="4" />
  <text x="380" y="263" fill="#f38ba8" font-size="11" font-weight="bold" text-anchor="middle">GARAGE DOORS THRESHOLD (y = 20 ft)</text>

  <!-- Bay Labels -->
  <text x="160" y="65" fill="#6c7086" font-size="14" font-weight="bold" text-anchor="middle">Bay 1 (Left)</text>
  <text x="380" y="65" fill="#89b4fa" font-size="15" font-weight="bold" text-anchor="middle">Bay 2 (Middle Bay)</text>
  <text x="600" y="65" fill="#6c7086" font-size="14" font-weight="bold" text-anchor="middle">Bay 3 (Right)</text>

  <!-- Middle Bay Camera Zone (FOV) -->
  <rect x="285" y="55" width="190" height="195" fill="#89b4fa" fill-opacity="0.12" stroke="#89b4fa" stroke-width="2" stroke-dasharray="4 4" rx="8" />
  <text x="380" y="95" fill="#89b4fa" font-size="12" font-weight="bold" text-anchor="middle">Camera Coverage Zone</text>
  <text x="380" y="112" fill="#a6adc8" font-size="11" text-anchor="middle">(Accuracy: ±1.0 ft / [X±1, Y±1])</text>

  <!-- 4 BLE Proxies at 4 Corners -->
  <!-- NW / P1 -->
  <circle cx="65" cy="50" r="10" fill="#fab387" />
  <text x="85" y="55" fill="#fab387" font-size="12" font-weight="bold">P1 (0, 0)</text>
  <!-- NE / P2 -->
  <circle cx="695" cy="50" r="10" fill="#fab387" />
  <text x="625" y="55" fill="#fab387" font-size="12" font-weight="bold">P2 (30, 0)</text>
  <!-- SW / P3 -->
  <circle cx="65" cy="255" r="10" fill="#fab387" />
  <text x="85" y="258" fill="#fab387" font-size="12" font-weight="bold">P3 (0, 20)</text>
  <!-- SE / P4 -->
  <circle cx="695" cy="255" r="10" fill="#fab387" />
  <text x="625" y="258" fill="#fab387" font-size="12" font-weight="bold">P4 (30, 20)</text>

  <!-- Car parked in Middle Bay -->
  <rect x="325" y="75" width="110" height="155" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="10" />
  <!-- Front Bumper iBeacon -->
  <circle cx="380" cy="80" r="7" fill="#a6e3a1" />
  <text x="380" y="155" fill="#cdd6f4" font-size="13" font-weight="bold" text-anchor="middle">Car</text>
  <text x="380" y="96" fill="#a6e3a1" font-size="10" font-weight="bold" text-anchor="middle">iBeacon (Front)</text>
</svg>

